<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail – Wireframe Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Wireframe Store</a>
    <nav>
      <a href="index.html" class="nav-link">Category</a>
    </nav>
  </header>

  <main class="detail-page">
    <a href="index.html" class="back-link">← Back to Category</a>

    <div class="detail-layout">
      <img class="detail-image" style="--vtn: product-1" src="img/13831-800.webp" alt="Product One" width="800">

      <div class="detail-info">
        <h1 class="detail-name">Product One</h1>
        <p class="detail-price">$49.00</p>
        <p class="detail-description">
          This is a placeholder product description. It gives the customer
          key information about material, dimensions, and features.
        </p>

        <div class="detail-meta">
          <div class="meta-row">
            <span class="meta-label">SKU</span>
            <span class="meta-value">WF-001</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Category</span>
            <span class="meta-value">General</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Availability</span>
            <span class="meta-value">In Stock</span>
          </div>
        </div>

        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </main>
</body>
</html>
